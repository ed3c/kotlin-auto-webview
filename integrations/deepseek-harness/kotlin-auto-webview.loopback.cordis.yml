# Default-off authenticated local-development example for DeepSeek Harness.
# Evidence subject: deepseek-ai/deepseek-harness@47f943859bef60e4160492346772ded9b24f765a
#
# The portable HTTP admission bridge is implemented in PR #30. A real Desktop/host
# listener is still NOT_IMPLEMENTED. This row cannot connect until such a listener
# exists and KOTLIN_AUTO_WEBVIEW_MCP_TOKEN is injected into the DSH host environment.
- insert:
    - id: kotlin-auto-webview-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: kotlin_auto_webview
        transport: streamable-http
        url: http://127.0.0.1:3090/mcp
        headers:
          Authorization: !!js >-
            (() => { const token = process.env.KOTLIN_AUTO_WEBVIEW_MCP_TOKEN?.trim(); if (!token) throw new Error('KOTLIN_AUTO_WEBVIEW_MCP_TOKEN is required'); return `Bearer ${token}`; })()
        toolCallTimeoutMs: 60000
        failOnStartupError: true
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
