name: MCP WebView simulator evidence

on:
  pull_request:
    paths:
      - 'composeApp/src/commonMain/kotlin/dev/ed3c/autowebview/runtime/**'
      - 'composeApp/src/commonMain/kotlin/dev/ed3c/autowebview/mcp/**'
      - 'composeApp/src/commonMain/kotlin/dev/ed3c/autowebview/ui/BrowserWorkspace.kt'
      - 'composeApp/src/commonTest/**'
      - 'composeApp/src/androidInstrumentedTest/**'
      - 'composeApp/build.gradle.kts'
      - '.github/workflows/mcp-webview-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Android Emulator MCP to WebView
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :composeApp:connectedDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-webview-android-emulator-reports
          path: |
            composeApp/build/outputs/androidTest-results/**
            composeApp/build/reports/androidTests/**
          if-no-files-found: error

  ios-shared-test:
    name: iOS Simulator shared lifecycle
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run shared lifecycle tests on iOS Simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test
      - name: Upload iOS shared test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-webview-ios-shared-test-results
          path: composeApp/build/test-results/**
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator app build and launch
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build iOS app for simulator
        run: |
          set -euo pipefail
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
          app_path="build/ios-simulator/Build/Products/Debug-iphonesimulator/KotlinAutoWebView.app"
          framework_dir="composeApp/build/bin/iosSimulatorArm64/debugFramework"
          mkdir -p "$app_path"
          xcrun --sdk iphonesimulator swiftc \
            iosApp/iosApp/iosApp.swift \
            -parse-as-library \
            -module-name KAWIOSApp \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios26.0-simulator \
            -F "$framework_dir" \
            -framework KotlinAutoWebView \
            -lsqlite3 \
            -o "$app_path/KotlinAutoWebView"
          cp iosApp/iosApp/Info.plist "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string KotlinAutoWebView' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string dev.ed3c.autowebview.ios' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string KotlinAutoWebView' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleShortVersionString string 0.1.0' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleVersion string 1' "$app_path/Info.plist"
      - name: Boot, install and launch iOS app
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(r[-1]["identifier"])')"
          device_id="$(xcrun simctl create KAW-MCP-WebView com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime_id")"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true; xcrun simctl delete "$device_id" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          app_path="$(find build/ios-simulator/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          launch_output="$(xcrun simctl launch "$device_id" dev.ed3c.autowebview.ios)"
          test -n "$launch_output"
          sleep 8
          xcrun simctl io "$device_id" screenshot build/ios-simulator/mcp-webview-ios-launch.png
      - name: Upload iOS simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-webview-ios-simulator-evidence
          path: build/ios-simulator/mcp-webview-ios-launch.png
          if-no-files-found: error
