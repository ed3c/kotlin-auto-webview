name: Deploy Web

# Deployment is manual until GitHub Pages is enabled for this repository with
# "GitHub Actions" as its source. Until then `configure-pages`/`deploy-pages` cannot succeed, so a
# push trigger would fail every merge to main and spend a runner proving something already known.
# Enabling Pages is a repository settings change and stays an owner decision (issue #5, ADR scope:
# "without changing repository Pages settings"). Restore the push trigger in the same change that
# enables Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - run: gradle :composeApp:wasmJsBrowserDistribution --stacktrace
      - id: web-artifact
        name: Validate production web artifact
        shell: bash
        run: |
          set -euo pipefail
          root=composeApp/build/dist/wasmJs/productionExecutable
          test -f "$root/index.html"
          mapfile -t wasm_files < <(find "$root" -maxdepth 1 -type f -name '*.wasm' -printf '%f\n' | sort)
          if [[ ${#wasm_files[@]} -ne 1 ]]; then
            echo "Expected exactly one top-level Wasm module, found ${#wasm_files[@]}" >&2
            printf '%s\n' "${wasm_files[@]}" >&2
            exit 30
          fi
          test -s "$root/${wasm_files[0]}"
          echo "wasm_file=${wasm_files[0]}" >> "$GITHUB_OUTPUT"
          sha256sum "$root/index.html" "$root/${wasm_files[0]}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTTPS and Wasm MIME evidence
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          WASM_FILE: ${{ steps.web-artifact.outputs.wasm_file }}
        run: bash tests/web-smoke/verify-pages.sh "$PAGE_URL" "$WASM_FILE"
