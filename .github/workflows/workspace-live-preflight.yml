name: Workspace Live Preflight

on:
  pull_request:
    paths:
      - "docs/workspace/live/**"
      - "schemas/workspace/live-preflight*.json"
      - "scripts/ci/check-workspace-live-preflight.py"
      - "tests/docs/workspace/live/**"
      - ".github/workflows/workspace-live-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Parse machine contracts
        run: |
          python3 -m json.tool docs/workspace/live/implementation-preflight.json >/dev/null
          python3 -m json.tool schemas/workspace/live-preflight.schema.json >/dev/null
      - name: Verify live evidence preflight
        run: python3 scripts/ci/check-workspace-live-preflight.py
      - name: Run planted preflight mutations
        run: python3 -m unittest discover -s tests/docs/workspace/live -p 'test_*.py' -v
