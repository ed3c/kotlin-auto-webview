name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  common-web-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs before the toolchain: it needs only the checkout, and a tree that cannot be checked
      # out safely on every platform should not spend a runner on Gradle first.
      - name: Reject case-colliding tracked paths
        run: scripts/ci/check-path-collisions.sh
      # Also checkout-only: a stray NUL makes a source file binary to git, so its diffs stop being
      # reviewable while everything still compiles and every test still passes.
      - name: Reject undeclared NUL bytes in tracked sources
        run: python3 scripts/ci/check-text-sources.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Verify common, desktop and web
        run: scripts/ci/run-gradle-with-annotations.sh :composeApp:allTests :composeApp:compileKotlinDesktop :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: web-production
          path: composeApp/build/dist/wasmJs/productionExecutable

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Assemble Android
        run: scripts/ci/run-gradle-with-annotations.sh :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  android-observation-emulator:
    if: github.event_name == 'pull_request' && github.head_ref == 'test/android-observation-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Run Android observation emulator fixture evidence
        env:
          KAW_A1_SOURCE_HEAD: b1c96e129009adc4c83b98a3728a9f1a39850025
          KAW_A1_SOURCE_TREE: 90f1a0ca98b5d1e35928abb61be19fe8eae96d9b
        run: scripts/ci/run-android-observation-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-observation-emulator-receipt
          path: |
            build/receipts/android-observation-emulator.json
            composeApp/build/reports/androidTests/connected/**
          if-no-files-found: warn

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Link iOS simulator framework
        run: scripts/ci/run-gradle-with-annotations.sh :composeApp:linkDebugFrameworkIosSimulatorArm64
