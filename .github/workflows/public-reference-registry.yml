name: Public Reference Registry

on:
  pull_request:
    paths:
      - 'docs/workspace/reference-index.public*.json'
      - 'scripts/ci/check_public_reference_registry.py'
      - 'scripts/ci/tests/test_public_reference_registry.py'
      - '.github/workflows/public-reference-registry.yml'
  push:
    branches: [main]
    paths:
      - 'docs/workspace/reference-index.public*.json'
      - 'scripts/ci/check_public_reference_registry.py'
      - 'scripts/ci/tests/test_public_reference_registry.py'
      - '.github/workflows/public-reference-registry.yml'

permissions:
  contents: read

jobs:
  public-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate public registry hygiene
        run: python3 scripts/ci/check_public_reference_registry.py --root docs/workspace
      - name: Run planted mutation controls
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_public_reference_registry.py' -v
